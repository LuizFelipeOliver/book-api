 services:
    db:
      image: postgres:16
      environment:
        POSTGRES_DB: api
        POSTGRES_USER: api
        POSTGRES_PASSWORD: api
      ports:
        - "5432:5432"

    app:
      build: .
      ports:
        - "8080:8080"
      environment:
        SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/api
        SPRING_DATASOURCE_USERNAME: api
        SPRING_DATASOURCE_PASSWORD: api
      depends_on:
        - db
