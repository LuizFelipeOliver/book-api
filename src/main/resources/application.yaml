 spring:
   application:
     name: api
   datasource:
     url: jdbc:postgresql://localhost:5432/${POSTGRES_DB:mydatabase}
     username: ${POSTGRES_USER:myuser}
     password: ${POSTGRES_PASSWORD:secret}
   jpa:
     database-platform: org.hibernate.dialect.PostgreSQLDialect
     hibernate:
       ddl-auto: validate
     open-in-view: false
